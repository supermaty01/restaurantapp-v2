name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # La puerta entera, la misma que corre `npm run check` en local y en pre-push.
  #
  # Antes esto comprobaba `format:check` + typecheck y tests **solo de
  # apps/mobile**: los 57 tests del Worker y los 146 asserts SQL existían y no
  # los ejecutaba nadie, y el lint vivía en un job aparte con
  # `continue-on-error: true`. docs/12 decía «check por workspace en cada
  # push/PR» desde el principio.
  #
  # Un lint que no bloquea es un lint que se aprende a ignorar; el motivo por el
  # que estaba así —violaciones de frontera pendientes de la fase 1— dejó de ser
  # cierto hace tiempo.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

  # El esquema, contra un Postgres de verdad: las 19 migraciones desde cero en
  # una base desechable por fichero de test. Es lo único que comprueba que las
  # políticas RLS dicen lo que creemos que dicen.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  # Informativo, no bloqueante, y a propósito.
  #
  # Los avisos de npm son casi todos de la cadena de construcción (eslint, jest,
  # drizzle-kit) y sus «arreglos» son downgrades mayores: `npm audit fix --force`
  # propone expo 46, jest 19 y drizzle-kit 0.18. El remedio destruye el proyecto
  # y el aviso no. Lo que sí importa es enterarse de uno **nuevo**, y para eso
  # basta con que se vea en el registro.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
